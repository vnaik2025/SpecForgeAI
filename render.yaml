services:
  - type: web
    name: specforge-ai
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "sh ./entrypoint.sh"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash"
      - key: AI_REQUEST_TIMEOUT
        value: "60.0"
